[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lextrace"
version = "0.1.0"
description = "合同证据链研究系统：从合同文档到可验证的审查结论"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "LexTrace Contributors"},
]
keywords = ["contract", "legal", "evidence", "rag", "multi-agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "openai>=1.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "docling>=2.4",
    "sentence-transformers>=4.1.0",
    "jieba>=0.42,<1",
    "numpy>=1.24",
]

[project.optional-dependencies]
# 开发依赖
dev = [
    "pytest>=7.0",
    "pytest-asyncio",
    "black",
    "isort",
    "mypy",
    "flake8",
]

[project.scripts]
# 命令行快捷入口（主流程按 README 用 python scripts/run_single.py 运行）
lextrace-eval = "src.contract.eval.main:main"
lextrace-ablation = "src.contract.eval.ablation:main"

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.black]
line-length = 120
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
