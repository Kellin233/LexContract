# =============================================================================
# LexTrace 全局默认配置文件
# =============================================================================
# 本文件定义了系统的全局参数、模型接口、各模块开关及超参数。
# 子模块可以通过加载此文件并覆盖特定键来实现自定义配置。
# =============================================================================

system:
  # 系统名称与版本号
  name: "LexTrace"
  version: "0.1.0"
  # 日志级别: DEBUG / INFO / WARNING / ERROR
  log_level: "INFO"
  # 工作目录，用于存放临时文件与输出报告
  work_dir: "./outputs"

model:
  # ---------------------------------------------------------------------------
  # 多后端 LLM 配置
  # ---------------------------------------------------------------------------
  # 后端选择策略:
  #   - "deepseek"  : 使用 DeepSeek API（需配置 .env 中的 DEEPSEEK_API_KEY）
  #   - "vllm"      : 使用本地 vLLM 服务（默认 http://localhost:8000/v1）
  #   - "openai"    : 使用 OpenAI API（需配置 .env 中的 OPENAI_API_KEY）
  #   - "auto"      : 自动检测，优先使用已配置 API Key 的远程后端
  #
  # 所有敏感信息（API Key、URL）均从 .env / .env.local 读取，
  # 修改此 YAML 即可切换后端，无需改动源码。
  # ---------------------------------------------------------------------------
  backend: "deepseek"          # 默认后端名称

  # 每后端上下文窗口（token，统一口径见 src/utils/tokens.py）。
  # 作为"丢旧轮次"截断兜底的阈值；Key 为各后端在 backend_mapping 中的名字。
  context_window_tokens:
    deepseek: 128000
    mimo: 32000

  # 以下为向后兼容的显式配置（优先级低于 .env）。
  # 推荐做法：在 .env 中配置，此处留空或注释掉。
  # base_model: "Qwen/Qwen2.5-7B-Instruct"
  # base_url: "http://localhost:8000/v1"
  # api_key: "EMPTY"

  # 通用采样参数（可被 .env 中对应后端的参数覆盖）
  temperature: 0.7
  top_p: 1.0
  max_tokens: 2048
  max_retries: 3
  retry_delay: 2.0

  # ---------------------------------------------------------------------------
  # 【唯一入口】模块级采样参数管理
  # ---------------------------------------------------------------------------
  # 设计原则：
  #   - 生成结构化输出（JSON / DAG）→ temperature 低（0.1-0.3）
  #   - 评分 → temperature 极低（0.1），确保一致性
  #   - 研究 / 合成 → temperature 中等（0.5-0.7），保留一定创造性
  #   - 摘要 / 压缩 → temperature 低（0.1），不需要创造性
  #
  # ⚠️ 重要：所有模块的采样参数（temperature / max_tokens / top_p）
  #     仅此一处定义，Agent YAML 中不再重复。
  #     避免 configs/agents/*.yaml 与此处不一致导致的配置漂移。
  # ---------------------------------------------------------------------------
  backend_sampling:
    # DeepSeek 后端的全局默认采样参数
    deepseek:
      temperature: 0.7
      max_tokens: 4096
      top_p: 1.0

    # MiMo 后端的全局默认采样参数
    mimo:
      temperature: 0.3
      max_tokens: 4096
      top_p: 1.0

    # 模块级覆盖（优先级高于后端全局默认）
    # 格式: 模块名 -> {temperature, max_tokens, top_p}
    modules:
      planner:
        temperature: 0.3       # 生成 JSON DAG 需要确定性
        max_tokens: 4096
      solver:
        temperature: 0.7       # 研究需要一定创造性
        max_tokens: 4096
      summarizer:
        temperature: 0.5       # 合成报告：流畅但不发散
        max_tokens: 16384      # 报告可能很长，给足 token 预算
      judge:
        temperature: 0.1       # 评分标准必须一致，避免漂移
        max_tokens: 2048
      compressor:
        temperature: 0.1       # 摘要是结构化任务
        max_tokens: 2048

  # ---------------------------------------------------------------------------
  # 后端分工映射（哪个模块用哪个后端）
  # ---------------------------------------------------------------------------
  backend_mapping:
    # 若留空，所有模块均使用上面的 default backend
    solver: "deepseek"        # 主研究 Agent：DeepSeek Flash（强推理）
    planner: "deepseek"       # 规划器：DeepSeek Flash
    summarizer: "deepseek"    # 合成器：DeepSeek Flash
    judge: "mimo"            # 评分器：Xiaomi MiMo 2.5 Pro
    compressor: "mimo"        # 上下文压缩：MiMo（摘要任务成本低）

orchestrator:
  # M1: Multi-Agent Orchestrator 配置
  # 同时运行的最大子 Agent 数量
  max_concurrent: 5
  # 全局超时时间（秒），超过则强制终止整个研究流程
  global_timeout_seconds: 600
  # 最大重规划（replan）轮数，防止无限循环
  max_replan_rounds: 3
  # 单次规划最多拆分的子问题数量
  max_sub_questions: 10
  # 子 Agent 执行失败后的最大重试次数
  max_subagent_retries: 2

planner:
  # M2: Adaptive Planner 配置
  # 每个子 Agent 最多允许的搜索/执行轮数
  max_search_rounds_per_subagent: 5
  # 是否启用动态计划调整（replan）
  enable_replan: true
  # 计划执行完成后是否自动进行完整性检查
  enable_completeness_check: true

compressor:
  # M3: Context Compressor 配置
  # 压缩前允许的最大上下文长度（token 数）
  max_context_length: 16000
  # 为输出保留的 token 预算（避免压缩后无法生成回答）
  output_reserve_tokens: 2048
  # L1 粗过滤阈值：低于此相似度的文档直接丢弃
  l1_threshold: 0.6
  # L2 细过滤阈值：中等相似度，进入摘要候选池
  l2_threshold: 0.8
  # L3 保留阈值：高于此相似度的原始文本完整保留
  l3_threshold: 0.95
  # 用于语义相似度计算的 embedding 模型
  embedding_model: "all-MiniLM-L6-v2"
  # 是否启用多级压缩（L1-L3）
  enable_multilevel: true

evolution:
  # M6: Self-Evolution Engine 配置
  # 总开关：是否启用在线自进化训练
  enabled: false
  # 进化总轮数（GRPO 迭代次数）
  num_rounds: 20
  # 每轮采样的 query 数量
  batch_size: 32
  # 每组 query 的采样组大小（GRPO group size）
  group_size: 8
  # 单条轨迹最大交互轮数
  grpo_steps: 50
  # LoRA 微调学习率
  learning_rate: 5.0e-6
  # KL 散度惩罚系数
  kl_coef: 0.01
  # LoRA 低秩维度
  lora_rank: 16
  # 评委模型集成数量（多数投票降低方差）
  judge_ensemble_size: 3
  # 每隔多少轮在保留校准集上验证一次
  held_out_calib_interval: 5
  # 每隔多少轮执行一次符号规则学习
  symbolic_learning_interval: 3

tools:
  # 工具模块全局配置
  web_search:
    enabled: true
    # mock_mode: 无真实搜索 API 时返回模拟结果，用于快速调试
    mock_mode: false
    # 单次搜索返回的最大结果数
    max_results: 10
    # 搜索结果摘要最大 token 数
    snippet_max_tokens: 512
  arxiv_reader:
    enabled: true
    # 单次 ArXiv 查询最多获取的论文数
    max_papers: 5
    # 论文摘要最大 token 数
    abstract_max_tokens: 1024
  code_sandbox:
    enabled: false
    # 代码执行超时（秒）
    timeout_seconds: 30
    # 允许的最大内存（MB）
    memory_limit_mb: 512

contract:
  # ---------------------------------------------------------------------------
  # 合同证据链流程配置（改造后的主流程）
  # ---------------------------------------------------------------------------
  # 最大研究轮数（Planner→Worker→Reviewer 一圈为 1），达上限以 PARTIALLY_SUFFICIENT 收尾
  max_iterations: 3
  # 编排模式：reviewed_incremental=Planner→Searcher→Reviewer→增量补查→Refiner；
  # direct=Planner→Searcher→Refiner（用于 ContractNLI 编排消融）
  orchestration_mode: "reviewed_incremental"
  # 最多同时执行的 EvidenceWorker 数（一次最多分配 3 个 worker）
  max_concurrent: 3
  # 全局超时（秒），到点强制进入 Refiner
  global_timeout_seconds: 900
  # Reviewer 判定 NEED_MORE 后，若本轮无“有效新增证据”（未覆盖上轮缺失要点）则提前停止
  stop_on_no_effective_new_evidence: true
  # 是否启用 CitationVerifier 原文校验（quote == DB full_text[start:end]）
  enable_evidence_verification: true
  # Refiner 输入预算（token）。超预算只告警/记录，暂不裁剪证据子集
  refiner_input_token_budget: 65536
  # Searcher 工具结果去重：同一切片/章节在本 Searcher 多轮内只注入一次完整原文，
  # 重复项保留 id/偏移/得分 + 短标记。关掉可做 A/B 或回退
  searcher_dedup_tool_results: true
  # Searcher 检索预算（可配）：最多多少“发 search 的轮”，每轮最多几个检索词。
  # 默认 3 轮 × 每轮 1 个 = 最多 3 个检索词/个 Searcher（旧值 3×3=9 太多、太耗时）。
  # 对照腿 B：1 轮 × 最多 3 个（一轮问满）。
  # A/B 实测（同一 5 条任务，并发 2）：两腿预测完全一致（Acc 0.80 / F1 0.72），无质量差异；
  # 1轮×3问 更快（223s vs 308s，-27% 墙钟）但 Searcher token 更多（145.6k vs 100.7k，+45%）。
  # 即“少轮次快、多检索词费 token”，故保持默认 3轮×1问（省 token）；要加速改两值为 1/3 即可。
  searcher_max_search_rounds: 3
  searcher_max_searches_per_round: 1
  # 会话/文档作用域可覆盖：--session / --doc
  # session_id: "S1"
  # doc_ids: []

conversation:
  # ---------------------------------------------------------------------------
  # 对话留档（每个 Agent 的 LLM 请求/响应逐字落盘，对话层深度，jsonl）
  # 开启后主研究链在报告同目录写 agent_conversations_<ts>_<query>.jsonl
  # ---------------------------------------------------------------------------
  enabled: false

eval:
  # ---------------------------------------------------------------------------
  # 评测配置（python -m src.contract.eval.main）
  # ---------------------------------------------------------------------------
  # 输出根目录（每个 run 会创建 <out>/<mode>/<时间戳>/）
  out_dir: "evaluation/runs"
  # 文档级 R@k 的 k 集合（本系统扩展指标：top-k 命中文档占比 + MRR）
  k: [1, 2, 4, 8, 16, 32, 64]
  # 字符级 span 指标的 cutoff（官方 PAKTON 口径，主指标）：同一次检索结果按
  # 排名截断为前 c 个 chunk 后与 gold 区间做字符重叠 P/R/F1；官方为 1/4/16/32/64
  cutoffs: [1, 4, 16, 32, 64]
  # ContractNLI 实例并发度（每条实例独立 toolkit/agent_pool/orchestrator，
  # 避免共享 toolkit.set_scope 在并发下互相覆盖文档作用域）
  nli_concurrency: 2
  # ContractNLI 的抽样数（None=全量）
  contractnli_limit:
  # ContractNLI 评测方式：正式完整链路（每条实例把 hypothesis 当研究问题、作用域锁到该合同，
  # 跑 Planner→Searcher→Reviewer→Refiner），并给 Refiner 切换评测专用提示词——结论输出为
  # entailment/contradiction/neutral 三选一 + 最相关证据（supporting_evidence_ids）。
  # 正式生产链路不注入该提示词，Refiner 保持默认生产提示词。
  nli_session: "nli-contractnli"
  # 抽样种子（可复现）
  seed: 0
  # 评测语料切片（ingest 时）：token 预算。500 = PAKTON chunk_sizes=[500] 对齐；
  # None 退回 600 字符定长。在 raw 偏移上做标题边界 + 重叠，偏移对齐不受影响
  ingest_max_tokens: 500
  ingest_min_tokens: 50
  ingest_overlap_tokens: 50
  # corpus 入 PG 时是否生成 bge-m3 embedding（关闭则退化为 BM25-only；已入库的 session 不受影响）
  embedding_corpus: true
  # 各 LegalBenchRAG benchmark 使用的数据库会话（隔离，避免跨 benchmark 污染）
  sessions:
    contractnli: "lb-contractnli"
    cuad: "lb-cuad"
    maud: "lb-maud"
    privacy_qa: "lb-privacy_qa"
